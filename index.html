<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Musik Free - Fix Folder mp3</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2563EB">
<style>:root{--bg:#FFFFFF;--text:#1E293B;--blue:#2563EB;--coral:#FF6B6B;--line:#E2E8F0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--text)}
.head{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 360px;gap:24px;max-width:1200px;margin:24px auto;padding:0 20px}
.banner{background:linear-gradient(135deg,#EFF6FF,#FFF1F2);border:1px solid #DBEAFE;border-radius:14px;padding:12px 14px}
.status{font-size:12px;padding:8px 12px;border-radius:10px;border:1px dashed #E2E8F0;margin:12px 0}
.card{border:1px solid #E2E8F0;border-radius:18px;padding:12px;background:white}
.cover{width:100%;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,#14B8A6,#EAB308)}
</style>
</head>
<body>
<header class="head"><div>♪ Musik Free - Fix Folder mp3</div><div>Light #FFFFFF</div></header>
<main class="grid">
<section>
<div class="banner">📂 Auto-scan /mp3 — fetch https://api.github.com/repos/grafer-ctrl/musik/contents/mp3 — fallback /music — ignore .yml</div>
<div id="scanStatus" class="status">✅ 2 lagu ditemukan di /mp3</div>
<div id="cards" class="cards"></div>
</section>
<aside><div id="player"></div></aside>
</main>
<script>
const API_MP3='https://api.github.com/repos/grafer-ctrl/musik/contents/mp3';
const API_FALLBACK='https://api.github.com/repos/grafer-ctrl/musik/contents/music';
const RAW='https://raw.githubusercontent.com/grafer-ctrl/musik/main/mp3/';
async function scan(){
  let items=[]; try{ let r=await fetch(API_MP3); items=await r.json(); }catch{}
  if(!Array.isArray(items) || items.filter(f=>f.name.toLowerCase().endsWith('.mp3')).length===0){
    try{ let r2=await fetch(API_FALLBACK); items=await r2.json(); }catch{}
  }
  const mp3=items.filter(f=>f.name && f.name.toLowerCase().endsWith('.mp3'));
  document.getElementById('scanStatus').textContent='✅ '+mp3.length+' lagu ditemukan di /mp3';
  mp3.forEach(f=>{
    const src=RAW+encodeURIComponent(f.name);
    const a=document.createElement('audio'); a.src=src; a.controls=true;
    document.getElementById('cards').appendChild(a);
  });
}
scan();
</script>
</body>
</html>
