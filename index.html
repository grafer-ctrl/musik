<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS Musik Free - music.appwus.com</title>
  
  <!-- PWA CORE -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Musik Free">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <style>
    :root{--bg:#FFFFFF;--text:#1E293B;--blue:#2563EB;--coral:#FF6B6B;--line:#E2E8F0}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--text)}
    .head{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
    .logo{display:flex;gap:10px;align-items:center;font-weight:800}.dot{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--coral));display:grid;place-items:center;color:white}
    .grid{display:grid;grid-template-columns:1fr 360px;gap:24px;max-width:1200px;margin:24px auto;padding:0 20px}
    .chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px}
    .chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#F8FAFC;cursor:pointer;white-space:nowrap}
    .chip.active{background:var(--text);color:white;border-color:var(--text)}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:16px}
    .card{border:1px solid var(--line);border-radius:16px;padding:14px;background:white;cursor:pointer;transition:.15s}
    .card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06);border-color:var(--blue)}
    .cover{width:100%;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:32px}
    .player{position:sticky;top:84px;border:1px solid var(--line);border-radius:20px;padding:18px;background:#F8FAFC}
    .btn{background:linear-gradient(135deg,var(--blue),var(--coral));color:white;border:0;padding:12px 16px;border-radius:12px;width:100%;font-weight:700;cursor:pointer}
    .install-banner{display:none;position:fixed;bottom:16px;left:16px;right:16px;background:var(--text);color:white;padding:12px 16px;border-radius:14px;align-items:center;justify-content:space-between;gap:12px;z-index:99}
    .install-banner.show{display:flex}
    @media(max-width:900px){.grid{grid-template-columns:1fr}.player{position:relative;top:0}}
  </style>
</head>
<body>
  <header class="head">
    <div class="logo"><div class="dot">♪</div><div>AWS Musik Free<br><small style="font-weight:400;color:#64748B">music.appwus.com</small></div></div>
    <div style="font-size:12px;color:#64748B">Light • Clean • Free</div>
  </header>

  <main class="grid">
    <section>
      <h1 style="font-size:28px;margin:0">Musik enak, terang & clean</h1>
      <p style="color:#64748B">Koleksi MP3 Free - bisa install di HP</p>
      <div class="chips" id="chips"></div>
      <div class="cards" id="cards"></div>
    </section>
    <aside class="player" id="player">
      <div style="text-align:center">
        <div id="p-cover" style="width:140px;height:140px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,#DBEAFE,#FFE4E6)">🎵</div>
        <h3 id="p-title" style="margin:0">Pilih lagu</h3>
        <p id="p-artist" style="color:#64748B;margin:4px 0 16px">—</p>
        <button class="btn" id="p-btn">▶ Putar</button>
        <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:#64748B"><span id="p-time">0:00</span><span id="p-dur">0:00</span></div>
        <div style="height:6px;background:#E2E8F0;border-radius:99px;margin-top:6px;overflow:hidden"><div id="p-bar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--coral))"></div></div>
        <button id="mood" style="margin-top:14px;width:100%;padding:10px;border-radius:10px;border:1px dashed #CBD5E1;background:white;cursor:pointer">🎲 Acak Mood</button>
      </div>
    </aside>
  </main>

  <!-- Install Banner -->
  <div class="install-banner" id="installBanner">
    <div><strong>📲 Install App</strong><br><small>Tambahkan ke layar utama HP</small></div>
    <button id="installBtn" style="background:white;color:#1E293B;border:0;padding:8px 14px;border-radius:10px;font-weight:700;cursor:pointer">Install</button>
    <button id="closeBanner" style="background:transparent;color:white;border:0;font-size:18px;cursor:pointer">×</button>
  </div>

  <footer style="text-align:center;padding:24px;color:#94A3B8;font-size:12px;border-top:1px solid #E2E8F0;margin-top:32px">© 2025 AWS Musik Free • PWA Ready • Light Theme #FFFFFF</footer>

  <script>
    // --- Mock Data (sama seperti versi light) ---
    const tracks = [{"id":1,"title":"Pagi Ceria","artist":"Awan Studio","dur":"3:12","cat":"Happy","color":"#2563EB","cover":"🌤️"},{"id":2,"title":"Senja di Pantai","artist":"Ombak Records","dur":"4:05","cat":"Chill","color":"#FF6B6B","cover":"🌅"},{"id":3,"title":"Fokus Kerja","artist":"Lo-Fi ID","dur":"2:48","cat":"Focus","color":"#0EA5E9","cover":"🎧"},{"id":4,"title":"Hujan Rintik","artist":"Suara Alam","dur":"3:55","cat":"Chill","color":"#8B5CF6","cover":"🌧️"},{"id":5,"title":"Jalan Pagi","artist":"Kota Beats","dur":"3:02","cat":"Happy","color":"#F59E0B","cover":"🚶"},{"id":6,"title":"Malam Tenang","artist":"Bintang Musik","dur":"4:22","cat":"Sleep","color":"#1E293B","cover":"🌙"},{"id":7,"title":"Semangat Pagi","artist":"Energi","dur":"2:33","cat":"Workout","color":"#FF6B6B","cover":"🔥"},{"id":8,"title":"Kopi Sore","artist":"Kedai Nada","dur":"3:40","cat":"Focus","color":"#D97706","cover":"☕"}];
    let activeCat='Semua', current=tracks[0], playing=false, prog=0, timer=null, deferredPrompt=null;

    const chipsEl=document.getElementById('chips'), cardsEl=document.getElementById('cards');
    function renderChips(){
      chipsEl.innerHTML=''; 
      ["Semua","Happy","Chill","Focus","Sleep","Workout"].forEach(c=>{
        const b=document.createElement('button'); b.className='chip'+(c===activeCat?' active':''); b.textContent=c;
        b.onclick=()=>{activeCat=c; renderChips(); renderCards();}; chipsEl.appendChild(b);
      })
    }
    function renderCards(){
      cardsEl.innerHTML=''; 
      tracks.filter(t=>activeCat==='Semua'||t.cat===activeCat).forEach(t=>{
        const d=document.createElement('div'); d.className='card';
        d.innerHTML=`<div class="cover" style="background:${t.color}15">${t.cover}</div><div style="margin-top:10px;font-weight:700">${t.title}</div><div style="font-size:12px;color:#64748B">${t.artist} • ${t.dur}</div><div style="margin-top:8px;font-size:11px;padding:4px 8px;background:#F1F5F9;border-radius:99px;display:inline-block">${t.cat}</div>`;
        d.onclick=()=>select(t); cardsEl.appendChild(d);
      })
    }
    function select(t){ current=t; document.getElementById('p-title').textContent=t.title; document.getElementById('p-artist').textContent=t.artist; document.getElementById('p-dur').textContent=t.dur; document.getElementById('p-cover').textContent=t.cover; document.getElementById('p-cover').style.background=t.color+'18'; prog=0; updateBar(); }
    function updateBar(){ document.getElementById('p-bar').style.width=prog+'%'; const m=Math.floor((prog/100*210)/60), s=Math.floor((prog/100*210)%60); document.getElementById('p-time').textContent=m+':'+String(s).padStart(2,'0'); }
    document.getElementById('p-btn').onclick=()=>{
      playing=!playing; document.getElementById('p-btn').textContent=playing?'⏸ Jeda':'▶ Putar';
      if(playing){ timer=setInterval(()=>{ prog+=0.6; if(prog>=100){prog=0; playing=false; document.getElementById('p-btn').textContent='▶ Putar'; clearInterval(timer);} updateBar(); },120);} else clearInterval(timer);
    };
    document.getElementById('mood').onclick=()=>{ const pool=tracks.filter(t=>t.cat!==activeCat); const r=pool[Math.floor(Math.random()*pool.length)]||tracks[0]; activeCat=r.cat; renderChips(); renderCards(); select(r); };

    renderChips(); renderCards(); select(tracks[0]);

    // --- PWA Register ---
    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(()=>console.log('SW registered')).catch(console.error); });
    }
    // --- Install Banner Logic ---
    window.addEventListener('beforeinstallprompt',(e)=>{
      e.preventDefault(); deferredPrompt=e; document.getElementById('installBanner').classList.add('show');
    });
    document.getElementById('installBtn').onclick=async()=>{
      if(!deferredPrompt) return; deferredPrompt.prompt(); const {outcome}=await deferredPrompt.userChoice; console.log(outcome); deferredPrompt=null; document.getElementById('installBanner').classList.remove('show');
    };
    document.getElementById('closeBanner').onclick=()=>document.getElementById('installBanner').classList.remove('show');
  </script>
</body>
</html>
